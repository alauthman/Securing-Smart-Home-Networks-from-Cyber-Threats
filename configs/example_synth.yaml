paths:
  raw_dir: data/raw
  processed_dir: data/processed
  model_dir: models
  reports_dir: reports

dataset:
  raw_glob:
    - "synth/*.csv"
  label_col: "label"
  time_col: null
  drop_cols: []
  sample_frac: 1.0

features:
  numeric_cols:
    - "pkt_size_mean"
    - "conn_rate"
    - "dns_qps"
  categorical_cols:
    - "proto"

model:
  kind: "rf"
  params:
    n_estimators: 300
    max_depth: null

train:
  task: "classification"
  test_size: 0.2
  random_state: 42
